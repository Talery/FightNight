name: Ошибка в FightNight
description: Сообщить о воспроизводимой проблеме beta-версии
title: '[bug] '
labels: ['bug', 'beta']
body:
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      placeholder: '1. ...\n2. ...\n3. ...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидание и фактический результат
    validations:
      required: true
  - type: input
    id: run
    attributes:
      label: Seed, сложность, устройство и браузер
      placeholder: 'Seed 123456 · сложность 3 · Android 15 · Chrome 140'
  - type: dropdown
    id: severity
    attributes:
      label: Критичность
      options: ['Блокер', 'Серьёзно', 'Неудобство', 'Косметика']
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Скриншот, видео или дополнительный контекст
